<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2c2047"><title>The Vanishing Energy Elixir | Thales Academy</title><style>
:root{color-scheme:dark;--bg:#221633;--card:#35234c;--orange:#fbb568;--green:#d4f6a6;--cream:#fff8ea;--line:#a08cb7;--red:#f8acb2}*{box-sizing:border-box}html{scroll-behavior:smooth}body{font:17px/1.5 system-ui,-apple-system,sans-serif;background:radial-gradient(ellipse at top,#5d3b76 0%,#241632 52%,#1b1129 100%);color:var(--cream);margin:0;min-height:100dvh}.page{max-width:720px;margin:auto;padding:18px 20px 50px}header{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}h1{font:900 clamp(28px,5vw,40px)/1.08 Georgia,serif;color:var(--orange);margin:22px 0 6px}h2{font-size:23px;line-height:1.22;color:#ffdb9e;margin:8px 0 14px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.15em;font-weight:900;color:var(--green)}.subtitle{color:#eee0f4;font-size:15px;margin:0 0 25px}.tag{background:#614679;padding:8px 12px;font-size:12px;border-radius:10px;font-weight:800}.card{border:2px solid var(--line);border-radius:22px;background:rgba(48,33,68,.94);padding:21px;margin:16px 0;box-shadow:0 10px 27px #160e22a8}button,input,select{font:inherit}button{touch-action:manipulation;cursor:pointer}.btn,.team,.key{min-height:55px;border:2px solid #a88ac6;border-radius:13px;background:#593977;color:#fff;font-weight:800;padding:13px}.btn{width:100%;background:var(--green);color:#1d2733;border-color:var(--green);margin:9px 0 0}.btn.secondary{background:#5a4272;color:#fff;border-color:#9b7bb3}.btn.danger{background:#812d40;border-color:#d89eaa;color:#fff}.btn:disabled,.key:disabled{opacity:.33;cursor:not-allowed}.teams{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.team{min-height:94px;font-size:19px}.digit-display{background:#110c1c;border:2px solid #b7f083;border-radius:15px;color:var(--green);font:700 35px/1.3 ui-monospace,SFMono-Regular,monospace;letter-spacing:9px;text-align:center;padding:17px;margin:17px 0}.keypad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}.key{font-size:28px;min-height:63px}.status{border-radius:12px;background:#1c142a;padding:14px;margin:15px 0;min-height:52px}.error{background:#643444;color:#fff4f5;border:2px solid var(--red)}.success{background:#224e43;border:2px solid #a2ebbd;color:#f7fff9}.clue{background:#fff0d1;color:#292139;font-weight:800;border-radius:12px;padding:20px;font-size:21px;line-height:1.44;margin:15px 0}.note{font-size:14px;color:#e4d0ee}.warning{background:#6b283c;border:2px solid var(--red);padding:13px;border-radius:12px;margin:13px 0;font-weight:800}input{width:100%;padding:12px 13px;min-height:54px;font-size:20px;border-radius:9px;border:2px solid #eabd7c;background:#fff9ed;color:#24132c}label{display:block;margin:10px 0 5px;font-weight:700}details summary{cursor:pointer;color:var(--orange);font-weight:800;padding:5px 0}details p{margin:10px 0}button:focus-visible,input:focus-visible,summary:focus-visible{outline:4px solid #fff;outline-offset:2px}.sparkle{text-align:center;font-size:47px;animation:appear .55s ease-out}@keyframes appear{0%{transform:scale(.65);opacity:0}100%{transform:scale(1);opacity:1}}.shake{animation:shake .3s ease-in-out}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;scroll-behavior:auto!important}}@media(max-width:400px){.page{padding:13px}.card{padding:14px}.key{min-height:57px}.digit-display{font-size:29px}}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
</style><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"></head><body><main id="app" class="page" aria-live="off"></main><script>
'use strict';const DATA={"version":4,"title":"The Vanishing Energy Elixir","suspects":[{"id":1,"real":"Mr. Reagan","name":"Phantom Reagan","traits":{"Lantern":"Amber","Track":"Bat","Ink":"Lime","Seal":"Moon"}},{"id":2,"real":"Ms. Moody","name":"Countess Moody","traits":{"Lantern":"Amber","Track":"Bat","Ink":"Lime","Seal":"Star"}},{"id":3,"real":"Mrs. Newman","name":"Moonfang Newman","traits":{"Lantern":"Amber","Track":"Bat","Ink":"Indigo","Seal":"Moon"}},{"id":4,"real":"Mrs. Sloop","name":"Mummy Sloop","traits":{"Lantern":"Amber","Track":"Bat","Ink":"Indigo","Seal":"Star"}},{"id":5,"real":"Mrs. Revels","name":"Zombie Revels","traits":{"Lantern":"Amber","Track":"Cat","Ink":"Lime","Seal":"Moon"}},{"id":6,"real":"Mrs. Knepper","name":"Goblin Knepper","traits":{"Lantern":"Amber","Track":"Cat","Ink":"Lime","Seal":"Star"}},{"id":7,"real":"Mrs. Adcock","name":"Potion Adcock","traits":{"Lantern":"Amber","Track":"Cat","Ink":"Indigo","Seal":"Moon"}},{"id":8,"real":"Mr. Davis","name":"Duskwing Davis","traits":{"Lantern":"Amber","Track":"Cat","Ink":"Indigo","Seal":"Star"}},{"id":9,"real":"Mrs. McLean","name":"Mystic McLean","traits":{"Lantern":"Violet","Track":"Bat","Ink":"Lime","Seal":"Moon"}},{"id":10,"real":"Mrs. Backus","name":"Broomstick Backus","traits":{"Lantern":"Violet","Track":"Bat","Ink":"Lime","Seal":"Star"}},{"id":11,"real":"Mrs. Dunn","name":"Dragonbreath Dunn","traits":{"Lantern":"Violet","Track":"Bat","Ink":"Indigo","Seal":"Moon"}},{"id":12,"real":"Mrs. Johnson","name":"Jack-o-Lantern Johnson","traits":{"Lantern":"Violet","Track":"Bat","Ink":"Indigo","Seal":"Star"}},{"id":13,"real":"Mr. Taylor","name":"Troll Taylor","traits":{"Lantern":"Violet","Track":"Cat","Ink":"Lime","Seal":"Moon"}},{"id":14,"real":"Mrs. Duke","name":"Dizzy Duke","traits":{"Lantern":"Violet","Track":"Cat","Ink":"Lime","Seal":"Star"}},{"id":15,"real":"Mr. Cox","name":"Crescendo Cox","traits":{"Lantern":"Violet","Track":"Cat","Ink":"Indigo","Seal":"Moon"}},{"id":16,"real":"Mrs. Casias","name":"Canvas Casias","traits":{"Lantern":"Violet","Track":"Cat","Ink":"Indigo","Seal":"Star"}}],"traits":["Lantern","Track","Ink","Seal"],"levels":[{"title":"The Lantern-Lit Lobby","location":"The Glittering Gateway","focus":"Sequences, place value, missing numbers, addition and subtraction","rule":"Add the seven numerical answers to build the four-digit lock code.","problems":[{"prompt":"Complete the pattern: 7, 14, 21, 28, 35, __.","answer":"42","points":42,"lesson":"L1","explain":"Count up by 7: 42.","kind":"standard"},{"prompt":"In 68,431, which digit is in the thousands place?","answer":"8","points":8,"lesson":"L7","explain":"The thousands digit is 8.","kind":"standard"},{"prompt":"The lantern cabinet reads 386 + ___ = 925. Find the missing number.","answer":"539","points":539,"lesson":"L10","explain":"925 - 386 = 539.","kind":"standard"},{"prompt":"A gargoyle collected 1,000 lantern tickets and used 468. How many remain?","answer":"532","points":532,"lesson":"L9","explain":"1000 - 468 = 532.","kind":"standard"},{"prompt":"How many numbers in 11, 14, 18, 23, 26, 30 are EVEN?","answer":"4","points":4,"lesson":"L2","explain":"14,18,26,30 are the four even numbers.","kind":"standard"},{"prompt":"What is the difference between 74 and 38?","answer":"36","points":36,"lesson":"L9","explain":"74 - 38 = 36.","kind":"standard"},{"prompt":"A hallway display has 325 tiny stars and receives 479 more. How many stars now?","answer":"804","points":804,"lesson":"Inv1/L6","explain":"325 + 479 = 804. This is a combining story problem.","kind":"standard"}],"code":"1965"},{"title":"The Clockwork Corridor","location":"The Hall of Hiccups","focus":"Multiplication, missing factors, division facts, dollars and cents","rule":"Add all seven answers. For Problem 6, use CENTS, not dollars.","problems":[{"prompt":"Eight bat-shaped bells have seven silver dots each. How many dots?","answer":"56","points":56,"lesson":"L15","explain":"8 x 7 = 56.","kind":"standard"},{"prompt":"Nine shelves hold 24 scrolls each. How many scrolls altogether?","answer":"216","points":216,"lesson":"L17","explain":"9 x 24 = 216.","kind":"standard"},{"prompt":"Six tables have 3 trays with 4 pumpkins on each tray. Total pumpkins?","answer":"72","points":72,"lesson":"L18","explain":"6 x 3 x 4 = 72.","kind":"standard"},{"prompt":"A corridor sign has TEN EQUAL PANELS and THREE are violet. Write the fraction violet. For the code, ADD its numerator and denominator.","answer":"3/10","points":13,"lesson":"Inv2","explain":"Three of ten equal parts is 3/10; contribution is 3+10=13.","kind":"standard"},{"prompt":"The missing factor is a blank box: 7 x BOX = 56. What is BOX?","answer":"8","points":8,"lesson":"L18","explain":"56 / 7 = 8.","kind":"standard"},{"prompt":"A ghost pays $13.45 and receives $6.25 back. How much was spent? Write DOLLARS AND CENTS; for the code use CENTS.","answer":"$7.20","points":720,"lesson":"L13","explain":"13.45 - 6.25 = $7.20 = 720 cents.","kind":"standard"},{"prompt":"Seventy-two candies are shared equally by nine desk goblins. Candies each?","answer":"8","points":8,"lesson":"L19","explain":"72 / 9 = 8.","kind":"standard"}],"code":"1093"},{"title":"The Mummy Museum","location":"The Gallery of Curious Clues","focus":"Division with remainders, factors, multiplication, fractions and time","rule":"Add all seven contributions. For #1 include the quotient AND remainder as separate numbers.","problems":[{"prompt":"Share 397 paper wraps among six mummy cases. Find the quotient AND remainder.","answer":"66 R1","points":67,"lesson":"L26","explain":"397 = 6 x 66 + 1, so 66 and 1 contribute 67.","kind":"standard"},{"prompt":"Write ALL positive factors of 24. How many are there?","answer":"8","points":8,"lesson":"L25","explain":"1,2,3,4,6,8,12,24 (8).","kind":"standard"},{"prompt":"Seven magic wagons each carry 40 lanterns. How many lanterns?","answer":"280","points":280,"lesson":"L29","explain":"7 x 40 = 280.","kind":"standard"},{"prompt":"Three of eight equal windowpanes are purple. What is the NUMERATOR of the purple fraction?","answer":"3","points":3,"lesson":"Inv3","explain":"The fraction is 3/8. Numerator: 3.","kind":"standard"},{"prompt":"From 9:15 to 10:55, how many minutes pass?","answer":"100","points":100,"lesson":"L28","explain":"1 hour 40 minutes = 100 minutes.","kind":"standard"},{"prompt":"A detective shares 124 clues equally among four file boxes. Clues in each box?","answer":"31","points":31,"lesson":"L26","explain":"124 / 4 = 31.","kind":"standard"},{"prompt":"Five supply carts each carry 160 glowing cards. How many cards?","answer":"800","points":800,"lesson":"L17","explain":"5 x 160 = 800.","kind":"standard"}],"code":"1289"},{"title":"The Moonbeam Laboratory","location":"The Squeaky Science Lab","focus":"Zero quotients, angles, polygons, triangles and mixed numbers","rule":"Start with 1,000. Add each contribution from #1-#7. For #6 add the whole part, numerator AND denominator.","problems":[{"prompt":"Divide 1,236 supplies equally into four storage crates. How many per crate?","answer":"309","points":309,"lesson":"L34","explain":"1236 / 4 = 309.","kind":"standard"},{"prompt":"Divide 2,040 little lights among five rooms. How many lights per room?","answer":"408","points":408,"lesson":"L34","explain":"2040 / 5 = 408.","kind":"standard"},{"prompt":"A pentagon-shaped window has how many sides?","answer":"5","points":5,"lesson":"L32","explain":"Pentagons have 5 sides.","kind":"standard"},{"prompt":"Use the printed angle diagram. How many degrees does the marked ray show?","answer":"130 degrees","points":130,"lesson":"Inv4","explain":"The ray passes through 130 degrees on the protractor.","kind":"angle"},{"prompt":"A triangle has sides of 3, 3 and 5 units. CLASSIFY it by its sides, then find its PERIMETER.","answer":"Isosceles; 11 units","points":11,"lesson":"L36","explain":"Two equal sides: isosceles; perimeter 3+3+5=11.","kind":"standard"},{"prompt":"Seventeen yards of ribbon are shared equally among four banners. Write yards per banner as a MIXED NUMBER.","answer":"4 1/4","points":9,"lesson":"L40","explain":"17 / 4 = 4 1/4; contribution 4+1+4=9.","kind":"standard"},{"prompt":"Draw two fraction bars to show 3/4 and 5/8. How many eighths are equivalent to 3/4?","answer":"6","points":6,"lesson":"L39","explain":"3/4 equals 6/8 when drawn in eighths.","kind":"standard"}],"code":"1878"},{"title":"The Grand Elixir Vault","location":"The Midnight Math Party Finale","focus":"Cumulative multistep reasoning with arithmetic, factors, time and angles","rule":"Add all seven contributions. For #6 add whole part, numerator AND denominator.","problems":[{"prompt":"The party has 3,000 entry tickets. Six wagons use 325 tickets EACH. How many tickets REMAIN?","answer":"1050","points":1050,"lesson":"L17+L9","explain":"6 x 325 = 1950; 3000 - 1950 = 1050.","kind":"standard"},{"prompt":"Share 3,024 glowing pencils equally among six enchanted lockers. How many per locker?","answer":"504","points":504,"lesson":"L34","explain":"3024 / 6 = 504.","kind":"standard"},{"prompt":"Eight masked dancers each hang 70 paper stars. How many stars?","answer":"560","points":560,"lesson":"L29","explain":"8 x 70 = 560.","kind":"standard"},{"prompt":"A rehearsal starts at 9:35 a.m. and ends at 12:20 p.m. How many MINUTES long is it?","answer":"165","points":165,"lesson":"L35","explain":"2 hr 45 min = 165 min.","kind":"standard"},{"prompt":"List every positive factor of 36. How many different factors?","answer":"9","points":9,"lesson":"L25","explain":"1,2,3,4,6,9,12,18,36: nine factors.","kind":"standard"},{"prompt":"Forty-seven yards of ribbon are divided equally into eight banners. Write the quotient as a MIXED NUMBER.","answer":"5 7/8","points":20,"lesson":"L40","explain":"47 / 8 = 5 7/8; contribute 5+7+8=20.","kind":"standard"},{"prompt":"Two measured moonbeam angles are 135 degrees and 40 degrees. How many degrees LARGER is the first?","answer":"95 degrees","points":95,"lesson":"Inv4","explain":"135 - 40 = 95.","kind":"standard"}],"code":"2403"}],"teamCulprits":{"Ravens":1,"Bats":6,"Owls":11,"Foxes":16}};const TEAMS=DATA.teamCulprits,TRAITS=DATA.traits;const PIN='7382';const STORAGE='haunted-thales-energy-elixir-v4';
let storageOK=false;try{localStorage.setItem(STORAGE+'-probe','ok');storageOK=localStorage.getItem(STORAGE+'-probe')==='ok';localStorage.removeItem(STORAGE+'-probe')}catch(e){}
const blank=()=>({v:4,team:null,level:0,solved:[],lockUntil:0,accuseUntil:0,accused:false,attempts:0});
function read(){if(!storageOK)return blank();try{const x=JSON.parse(localStorage.getItem(STORAGE));if(!x||x.v!==4)return blank();if(x.team!==null&&!Object.hasOwn(TEAMS,x.team))return blank();if(!Number.isInteger(x.level)||x.level<0||x.level>4)return blank();if(!Array.isArray(x.solved)||x.solved.some((a,i)=>a!==i)||x.solved.length>5)return blank();if(x.level>x.solved.length||x.level<x.solved.length-1)return blank();if(!Number.isFinite(x.lockUntil)||!Number.isFinite(x.accuseUntil)||x.lockUntil<0||x.accuseUntil<0)return blank();if(typeof x.accused!=='boolean'||(x.accused&&x.solved.length!==5))return blank();if(x.team===null&&(x.level!==0||x.solved.length))return blank();return x}catch(e){return blank()}}
let state=read(),digits='',ticker=null,pendingTeam=null;
function save(){if(!storageOK)return;try{localStorage.setItem(STORAGE,JSON.stringify(state))}catch(e){storageOK=false;showStorageWarning()}}
function showStorageWarning(){const a=document.getElementById('storageAlert');if(a)a.hidden=storageOK}
function esc(x){return String(x).replace(/[&<>"']/g,k=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[k]))}
function culprit(){return DATA.suspects.find(s=>s.id===TEAMS[state.team])}
function clue(i){if(i<4){const p=culprit();const t=TRAITS[i];return `EVIDENCE ${i+1}: The ${t.toLowerCase()} marking is ${p.traits[t].toUpperCase()}. Cross out every suspect with a different ${t.toLowerCase()} marking.`}return 'FINAL EVIDENCE: The master vault is open. Use ALL FOUR clues and your paper roster to make a final accusation.'}
function layout(content){clearInterval(ticker);ticker=null;const app=document.getElementById('app');app.innerHTML=`<header><span class="eyebrow">THALES ACADEMY / THE MIDNIGHT MATH MYSTERY</span><span class="tag">${state.team?esc(state.team)+' DETECTIVES':'TEACHER SETUP'}</span></header><h1>The Vanishing<br>Energy Elixir</h1><p class="subtitle">Five mysterious vaults. Four teams. One very silly Halloween prank.</p><div id="storageAlert" class="warning" ${storageOK?'hidden':''}>STORAGE WARNING: This browser is not saving progress. Do not use for the classroom until storage is working.</div>${content}<p class="note">All calculations are on paper. This iPad stores one team's case locally; devices do not synchronize.</p>`}
function clickTeam(t){if(state.team!==null||!Object.hasOwn(TEAMS,t))return;pendingTeam=t;document.getElementById('assign').innerHTML=`<label for="assignpin">Teacher PIN to assign ${esc(t)}</label><input id="assignpin" type="password" inputmode="numeric" autocomplete="off" maxlength="4"><button class="btn" onclick="confirmTeam()">ASSIGN THIS IPAD TO ${esc(t)}</button><p id="assignresult" class="note" role="status"></p>`;document.getElementById('assignpin').focus()}
function confirmTeam(){const el=document.getElementById('assignpin');if(!el)return;if(!storageOK){document.getElementById('assignresult').textContent='Progress cannot be saved. Use a supported deployment before starting.';return}if(el.value!==PIN){document.getElementById('assignresult').textContent='PIN not accepted';return}state=blank();state.team=pendingTeam;pendingTeam=null;save();render()}
function logHTML(){return `<details class="card" id="log"><summary>📋 CASE CLUES UNLOCKED (${state.solved.length} / 5)</summary>${state.solved.map(i=>`<p><b>Vault ${i+1}:</b> ${esc(clue(i))}</p>`).join('')||'<p>No clues unlocked yet.</p>'}</details>`}
function resetHTML(){return `<details class="card" id="teacher"><summary>Teacher controls / reset this iPad</summary><p class="note">A reset permanently clears this device's local team assignment and progress. Other teams are unaffected.</p><label for="resetpin">Teacher PIN</label><input id="resetpin" type="password" inputmode="numeric" autocomplete="off" maxlength="4"><button class="btn danger" onclick="requestReset()">REQUEST RESET</button><div id="resetsection"></div></details>`}
function requestReset(){if(document.getElementById('resetpin').value!==PIN){document.getElementById('resetsection').textContent='PIN not accepted';return}document.getElementById('resetsection').innerHTML=`<p class="warning">CONFIRM: Erase this team's case from this iPad?</p><button class="btn danger" onclick="confirmReset()">YES, RESET THIS IPAD</button>`}
function confirmReset(){state=blank();save();render()}
function lockHTML(){return `<div class="card"><div class="eyebrow">VAULT ${state.level+1} OF 5</div><h2>${esc(DATA.levels[state.level].title)}</h2><p>Complete the paper calculations and enter the exact FOUR-DIGIT lock code.</p><div class="digit-display" id="display" aria-label="Entered four-digit code">_ _ _ _</div><div class="keypad">${['1','2','3','4','5','6','7','8','9','CLR','0','⌫'].map(n=>`<button class="key" data-digit="${n}" onclick="press('${n}')" aria-label="${n==='CLR'?'Clear':n==='⌫'?'Delete':n}">${n}</button>`).join('')}</div><button class="btn" id="submit" onclick="submitCode()" disabled>UNLOCK VAULT</button><p id="feedback" class="status" role="status">Seven checked answers form this lock. Use the code rule on your sheet.</p></div>`}
function solvedHTML(){const i=state.level;return `<div class="card"><div class="sparkle">🔓 ✨ 🎃</div><div class="eyebrow">VAULT ${i+1} OPENED</div><div class="clue">${esc(clue(i))}</div>${i<4?`<div class="status success">Show Mr. Reagan this unlocked screen to receive the next level's worksheet.</div><button class="btn" onclick="showAdvance()">NEXT LEVEL / TEACHER CHECK</button><div id="advance"></div>`:accuseHTML()}</div>`}
function showAdvance(){document.getElementById('advance').innerHTML='<label for="advancepin">Teacher PIN</label><input id="advancepin" type="password" inputmode="numeric" maxlength="4" autocomplete="off"><button class="btn secondary" onclick="advance()">TEACHER APPROVES NEXT VAULT</button><p id="advanceresult" class="note" role="status"></p>'}
function advance(){const a=document.getElementById('advancepin');if(!a||state.solved.length!==state.level+1||state.level>=4)return;if(a.value!==PIN){document.getElementById('advanceresult').textContent='PIN not accepted';return}state.level++;state.lockUntil=0;save();render()}
function accuseHTML(){return `<p class="status success">Congratulations! Your calculations unlocked the last vault. Now you must IDENTIFY the prankster.</p><label for="suspectid">Enter the TWO-DIGIT suspect ID printed on your paper roster</label><input id="suspectid" inputmode="numeric" pattern="[0-9]*" maxlength="2" placeholder="01 - 16"><button class="btn" onclick="accuse()" id="accusebtn">SUBMIT TEAM ACCUSATION</button><p id="accusefeedback" role="status" class="status">No names are shown until your accusation is correct.</p>`}
function accuse(){if(Date.now()<state.accuseUntil)return;const el=document.getElementById('suspectid');if(!el)return;const id=el.value.trim();if(!/^\d{1,2}$/.test(id)){document.getElementById('accusefeedback').textContent='Enter a suspect ID, not a name.';return}if(Number(id)!==TEAMS[state.team]){state.accuseUntil=Date.now()+15000;save();updateAccuse();return}state.accused=true;save();render()}
function updateAccuse(){const feedback=document.getElementById('accusefeedback'),b=document.getElementById('accusebtn');if(!feedback||!b)return;const n=Math.max(0,Math.ceil((state.accuseUntil-Date.now())/1000));b.disabled=n>0;feedback.className=n?'status error':'status';feedback.textContent=n?'Evidence mismatch. Recheck the four clues. Retry in '+n+' seconds.':'Choose the one suspect supported by all four clues.'}
function press(n){if(Date.now()<state.lockUntil||state.solved.includes(state.level))return;if(n==='CLR')digits='';else if(n==='⌫')digits=digits.slice(0,-1);else if(digits.length<4&&/^[0-9]$/.test(n))digits+=n;const el=document.getElementById('display');if(el)el.textContent=digits.padEnd(4,'_').split('').join(' ');updateLock()}
function submitCode(){if(Date.now()<state.lockUntil||digits.length!==4||state.solved.includes(state.level))return;if(digits===DATA.levels[state.level].code){state.solved.push(state.level);state.attempts=0;digits='';save();render();return}digits='';state.attempts=(state.attempts||0)+1;state.lockUntil=Date.now()+30000;save();const el=document.getElementById('display');if(el)el.textContent='_ _ _ _';updateLock()}
function updateLock(){const left=Math.max(0,Math.ceil((state.lockUntil-Date.now())/1000)),locked=left>0;document.querySelectorAll('[data-digit]').forEach(b=>b.disabled=locked);const submit=document.getElementById('submit');if(submit)submit.disabled=locked||digits.length!==4;const fb=document.getElementById('feedback');if(!fb)return;if(locked){fb.className='status error shake';fb.textContent=`Oops! Wrong code. Cool off for ${left} seconds and check every calculation.`}else{fb.className='status';fb.textContent=state.attempts?'The lock is ready. Recheck all seven answers before trying again.':'Seven checked answers form this lock. Use the code rule on your sheet.'}}
function render(){digits='';if(!state.team){layout(`<div class="card"><div class="eyebrow">Step 1 / Teacher assignment</div><h2>Assign this iPad to one detective team</h2><div class="teams">${Object.keys(TEAMS).map(t=>`<button class="team" onclick="clickTeam('${t}')">${t==='Ravens'?'🪶':t==='Bats'?'🦇':t==='Owls'?'🦉':'🦊'} ${t}</button>`).join('')}</div><div id="assign"></div><p class="note">Keep each iPad on its assigned team for the whole game.</p></div>`);return}
 if(state.accused){layout(`<div class="card"><div class="sparkle">🎉 🎃 🧪 ✨</div><h2>CASE CLOSED!</h2><div class="clue">${esc(culprit().name)} (Suspect ${String(culprit().id).padStart(2,'0')}) hid Mr. Reagan's Energy Elixir to prepare the surprise Midnight Math Party!</div><p>The culprit has returned the bottle, the copier has stopped printing bats, and every team has rescued math class. Outstanding detective work!</p><div class="status success">Show Mr. Reagan your completed evidence record and solved papers.</div></div>${logHTML()}${resetHTML()}`);return}
 const done=state.solved.includes(state.level);layout((done?solvedHTML():lockHTML())+logHTML()+resetHTML());
 if(!done){updateLock();ticker=setInterval(updateLock,250)}else if(state.level===4){updateAccuse();ticker=setInterval(updateAccuse,250)}
}
render();
</script><script>if('serviceWorker' in navigator && location.protocol==='https:'){navigator.serviceWorker.register('./sw.js').catch(()=>{});}</script></body></html>
